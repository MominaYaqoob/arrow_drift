name: arrow_drift
description: "Arrow Drift : Puzzle Game"
publish_to: 'none'

version: 1.0.5+6

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  shared_preferences: ^2.5.3
  google_fonts: ^6.2.1
  go_router: ^15.1.2
  url_launcher: ^6.3.2
  package_info_plus: ^10.2.1
  audioplayers: ^6.8.1
  google_mobile_ads: ^8.0.0
  connectivity_plus: ^7.1.1
  vibration: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.5
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#0E1726"
  adaptive_icon_foreground: assets/branding/app_icon.png
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/branding/app_icon.png
  windows:
    generate: true
    image_path: assets/branding/app_icon.png
  macos:
    generate: true
    image_path: assets/branding/app_icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/branding/app_icon.png
    - assets/sounds/level_win.wav
    - assets/sounds/ui_tap.wav
    - assets/sounds/arrow_escape.wav
    - assets/sounds/arrow_hit.wav
